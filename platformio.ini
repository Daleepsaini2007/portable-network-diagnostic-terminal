; Portable Network Diagnostic Terminal - M5Stack Cardputer-Adv (ESP32-S3)
;
; Libraries are pinned to the exact commits the APIs were verified against, so
; builds are reproducible. Bump them deliberately and re-run the hardware checklist.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
; espressif32@6.9.0 = Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7
platform = espressif32@6.9.0
; The Cardputer is built around a StampS3 (ESP32-S3, 8 MB flash)
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -Wno-unused-parameter
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01
    https://github.com/m5stack/M5Unified.git#fd40d58b8405ad1e7ed7afab548dab5e7cec5bbb
    https://github.com/m5stack/M5GFX.git#c5a3fefad0b38a52cc750e2c4761e339a69a7208
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.4.1
; IRremote is only here because M5Cardputer's library.json declares it;
; this firmware does not use the IR hardware.

; Hardware-independent unit tests (no board needed):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror -Isrc
build_src_filter = -<*> +<core/>
test_build_src = yes
